# Render Blueprint for GreenPay Academic Research Prototype
# https://render.com/docs/blueprint-spec

databases:
  - name: greenpay-db
    databaseName: greenpay
    user: greenpay
    plan: free
    region: singapore # or oregon / frankfurt
    ipAllowList: [] # internal only

services:
  # 1. FastAPI Backend API Web Service
  - type: web
    name: greenpay-api
    runtime: python
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: greenpay-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: METER_ENCRYPTION_KEY
        value: gp-aes256-key-32chars-research! # Exact 32 characters
      - key: CSRF_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        value: '["https://greenpay-web.onrender.com","https://greenpay-admin.onrender.com"]'
      - key: BUSINESS_ENTITY_TYPE
        value: ACADEMIC_PROTOTYPE
      - key: BUSINESS_CONTACT_EMAIL
        value: contact@greenpay.blr

  # 2. Citizen Web Portal & Public Site
  - type: web
    name: greenpay-web
    runtime: static
    region: singapore
    plan: free
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://greenpay-api.onrender.com/api/v1
      - key: VITE_BUSINESS_ENTITY_TYPE
        value: ACADEMIC_PROTOTYPE

  # 3. Super Admin & Operations Portal
  - type: web
    name: greenpay-admin
    runtime: static
    region: singapore
    plan: free
    buildCommand: npm install && npm run build:admin
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://greenpay-api.onrender.com/api/v1
      - key: VITE_BUSINESS_ENTITY_TYPE
        value: ACADEMIC_PROTOTYPE
