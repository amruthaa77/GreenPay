name: GreenPay Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: greenpay_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio psycopg2-binary httpx

      - name: Run Backend Pytest Suite (SQLite triggers & models)
        env:
          PYTHONPATH: apps/api
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: test_secret_key_32_bytes_super_secure_2026
          ENCRYPTION_KEY: gK7xL1mN3pQ5sT7vX9zB2dF4hJ6lP8rT
          HMAC_SECRET: test_meter_hmac_secret_2026
          ENV: development
        run: |
          pytest apps/api/tests -v

      - name: Run PostgreSQL Append-Only Immutability Verification (Amendment #9)
        env:
          PYTHONPATH: apps/api
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/greenpay_ci_test
          SECRET_KEY: test_secret_key_32_bytes_super_secure_2026
          ENCRYPTION_KEY: gK7xL1mN3pQ5sT7vX9zB2dF4hJ6lP8rT
          HMAC_SECRET: test_meter_hmac_secret_2026
          ENV: development
        run: |
          pytest apps/api/tests/test_ledger_immutability.py -v

  tokens-and-config:
    name: Token Contrast & Config Validator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: WCAG 2.2 AA Design Token Contrast Audit
        run: npm run test:tokens

      - name: Business Configuration Strict Validator Suite (Amendment #1)
        run: npx tsx packages/config/business_config.test.ts

  frontend-builds:
    name: TypeScript Check & Vite Bundles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Citizen Web App (@greenpay/web)
        run: npm run build:web

      - name: Build Admin & Supervisor Portal (@greenpay/admin)
        run: npm run build:admin
