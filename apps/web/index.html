<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Theme Pre-Initialization to Prevent FOUC -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('greenpay-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>GreenPay Bengaluru | Waste Responsibly. Earn Sustainably.</title>
    <meta name="title" content="GreenPay Bengaluru | Waste Responsibly. Earn Sustainably." />
    <meta name="description" content="Transparent household waste accountability for Bengaluru. Doorstep collection verification, explainable Green Score, and sustainable civic points." />
    <meta name="theme-color" content="#22C55E" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://localhost:5173/" />
    <meta property="og:title" content="GreenPay Bengaluru | Transparent Household Waste Collection" />
    <meta property="og:description" content="Waste responsibly. Track transparently. Earn sustainably. Civic waste accountability platform for Bengaluru households." />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="http://localhost:5173/" />
    <meta property="twitter:title" content="GreenPay Bengaluru | Transparent Waste Accountability" />
    <meta property="twitter:description" content="Waste responsibly. Track transparently. Earn sustainably." />
    
    <!-- Canonical -->
    <link rel="canonical" href="http://localhost:5173/" />
    
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
